<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>siorie — group detail</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="wordmark" href="./groups.html">siorie</a>
        <button class="avatar-btn" type="button" aria-label="Open menu">
          <span class="avatar-fallback">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </span>
        </button>
      </header>

      <main class="app-main">
        <div class="page-head">
          <div class="eyebrow-row">
            <span class="eyebrow">Group</span>
            <a class="btn btn-ghost btn-xs" href="./group-edit.html">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
              </svg>
              Edit
            </a>
          </div>
          <h1 class="group-title">マンガ喫茶</h1>
        </div>

        <div class="sectionhead">
          <h2>Items</h2>
          <a class="btn btn-primary btn-sm" href="./item-new.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Add item
          </a>
        </div>

        <ul class="item-list">
          <li>
            <a class="item-row" href="./item-detail.html">
              <span class="title">ONE PIECE</span>
              <span class="vol"><span class="unit">vol.</span>104</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </a>
          </li>
          <li>
            <a class="item-row" href="./item-detail.html">
              <span class="title">葬送のフリーレン 公式コミックガイド</span>
              <span class="vol"><span class="unit">vol.</span>12</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </a>
          </li>
          <li>
            <a class="item-row" href="./item-detail.html">
              <span class="title">ヴィンランド・サガ</span>
              <span class="vol"><span class="unit">vol.</span>5</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </a>
          </li>
          <li>
            <a class="item-row" href="./item-detail.html">
              <span class="title">よつばと!</span>
              <span class="vol"><span class="unit">vol.</span>15</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </a>
          </li>
        </ul>
      </main>

      <footer class="app-footer">siorie</footer>
    </div>
  </body>
</html>
