<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>siorie — item detail</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="wordmark" href="./groups.html">siorie</a>
        <button class="avatar-btn" type="button" aria-label="Open menu">
          <span class="avatar-fallback">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </span>
        </button>
      </header>

      <main class="app-main">
        <div class="page-head">
          <div class="eyebrow-row">
            <span class="eyebrow">Item</span>
            <a class="btn btn-ghost btn-xs" href="./item-edit.html">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
              </svg>
              Edit
            </a>
          </div>
          <h1 class="item-title">葬送のフリーレン 公式コミックガイド</h1>
        </div>

        <section class="volume card">
          <div class="volume-label">Completed volume</div>
          <span class="volume-num">12</span>
        </section>

        <div class="item-actions">
          <button class="btn btn-primary" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Add a volume
          </button>
        </div>
      </main>

      <footer class="app-footer">siorie</footer>
    </div>
  </body>
</html>
