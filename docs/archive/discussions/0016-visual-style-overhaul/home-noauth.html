<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>siorie — home (signed out)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700&family=M+PLUS+Rounded+1c:wght@400;500;700&family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* === siorie shared tokens === */
      :root {
        color-scheme: light;
        --bg-1: #ffffff;
        --bg-2: #f2ede0;
        --primary: #48624f;
        --primary-hover: #3c5343;
        --secondary: #e3c25c;
        --text: #2a332c;
        --text-muted: #5c6a5f;
        --border: #bdb5a0;
        --error: #a9473e;
        --error-hover: #8f3c34;
        --on-primary: #ffffff;
        --ring: rgba(72, 98, 79, 0.38);
        --text-2xs: 10px;
        --text-xs: 13px;
        --text-base: 16px;
        --text-md: 20px;
        --text-lg: 26px;
        --text-xl: 42px;
        --leading-body: 1.618;
        --leading-tight: 1.2;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 20px;
        --space-5: 32px;
        --space-6: 52px;
        --radius-sm: 8px;
        --radius: 13px;
        --radius-lg: 21px;
        --radius-pill: 999px;
        --content-max: 430px;
        --font:
          'Zen Maru Gothic', 'M PLUS Rounded 1c', ui-rounded,
          'Hiragino Maru Gothic ProN', system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg-2);
        color: var(--text);
        font-family: var(--font);
        font-size: var(--text-base);
        line-height: var(--leading-body);
        -webkit-font-smoothing: antialiased;
      }
      /* home screen — does NOT use the common layout (per 0004) */
      .home {
        min-height: 100vh;
        max-width: var(--content-max);
        margin-inline: auto;
        padding: var(--space-6) var(--space-4);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-5);
        text-align: center;
      }
      @media (min-width: 460px) {
        .home {
          border-inline: 1px solid var(--border);
        }
      }
      .brand {
        font-size: var(--text-xl);
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .tagline {
        margin: calc(var(--space-4) * -1) 0 0;
        color: var(--text-muted);
        font-size: var(--text-xs);
        max-width: 30ch;
      }
      .signin {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-3);
      }
      /* Google-rendered button — the one control not restyled. */
      .gis-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        height: 40px;
        padding: 0 var(--space-4);
        background: #fff;
        border: 1px solid #dadce0;
        border-radius: 4px;
        color: #3c4043;
        font-family: 'Roboto', var(--font);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      .caption {
        font-size: var(--text-2xs);
        color: var(--text-muted);
        max-width: 32ch;
        line-height: var(--leading-body);
      }
    </style>
  </head>
  <body>
    <main class="home">
      <div class="brand">siorie</div>
      <p class="tagline">Keep track of which manga you’ve read, and how far.</p>
      <div class="signin">
        <span class="gis-btn" role="button">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.9-2.26 5.36-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Sign in with Google
        </span>
        <span class="caption">
          Rendered by Google Identity Services. Not restyled — the sole exception
          to the moss palette and the “every button has a single-colour icon”
          rule.
        </span>
      </div>
    </main>
  </body>
</html>
