<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>siorie — home (signed in)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* === siorie shared tokens === */
      :root {
        color-scheme: light;
        --bg-1: #ffffff;
        --bg-2: #f2ede0;
        --primary: #48624f;
        --primary-hover: #3c5343;
        --secondary: #e3c25c;
        --text: #2a332c;
        --text-muted: #5c6a5f;
        --border: #bdb5a0;
        --error: #a9473e;
        --on-primary: #ffffff;
        --ring: rgba(72, 98, 79, 0.38);
        --text-2xs: 10px;
        --text-xs: 13px;
        --text-base: 16px;
        --text-md: 20px;
        --text-lg: 26px;
        --text-xl: 42px;
        --leading-body: 1.618;
        --leading-tight: 1.2;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 20px;
        --space-5: 32px;
        --space-6: 52px;
        --radius-sm: 8px;
        --radius: 13px;
        --radius-pill: 999px;
        --content-max: 430px;
        --font:
          'Zen Maru Gothic', 'M PLUS Rounded 1c', ui-rounded,
          'Hiragino Maru Gothic ProN', system-ui, sans-serif;
        --font-ugc:
          ui-rounded, 'Hiragino Maru Gothic ProN', 'Hiragino Sans',
          'Yu Gothic', 'Yu Gothic UI', Meiryo, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg-2);
        color: var(--text);
        font-family: var(--font);
        font-size: var(--text-base);
        line-height: var(--leading-body);
        -webkit-font-smoothing: antialiased;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        min-height: 44px;
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius-pill);
        border: 1.5px solid transparent;
        font: inherit;
        font-weight: 500;
        line-height: 1;
        cursor: pointer;
        text-decoration: none;
        transition:
          background-color 0.15s,
          border-color 0.15s;
      }
      .btn svg {
        width: 20px;
        height: 20px;
        flex: none;
      }
      .btn-primary {
        background: var(--primary);
        color: var(--on-primary);
      }
      .btn-primary:hover {
        background: var(--primary-hover);
      }
      .btn-outline {
        background: transparent;
        border-color: var(--primary);
        color: var(--primary);
      }
      .btn-outline:hover {
        background: rgba(72, 98, 79, 0.12);
      }
      .btn-block {
        width: 100%;
      }
      /* home screen — does NOT use the common layout (per 0004) */
      .home {
        min-height: 100vh;
        max-width: var(--content-max);
        margin-inline: auto;
        padding: var(--space-6) var(--space-4);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-5);
        text-align: center;
      }
      @media (min-width: 460px) {
        .home {
          border-inline: 1px solid var(--border);
        }
      }
      .brand {
        font-size: var(--text-xl);
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .account {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-3);
      }
      .account .name {
        font-weight: 500;
        font-family: var(--font-ugc);
      }
      .avatar-lg {
        width: 72px;
        height: 72px;
        border-radius: var(--radius-pill);
        border: 1px solid var(--border);
        background: var(--bg-1);
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--text-muted);
      }
      .avatar-lg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .home-actions {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
        width: 100%;
        max-width: 260px;
      }
      .caption {
        font-size: var(--text-2xs);
        color: var(--text-muted);
        max-width: 34ch;
        line-height: var(--leading-body);
      }
    </style>
  </head>
  <body>
    <!-- Signed-in home. No common layout, so the Groups link and Log out sit
         directly on the screen (there is no nav trigger here). Per 0004. -->
    <main class="home">
      <div class="brand">siorie</div>
      <div class="account">
        <div class="avatar-lg"><img src="https://i.pravatar.cc/144?img=13" alt="" /></div>
        <span class="name">山田 太郎</span>
      </div>
      <div class="home-actions">
        <a class="btn btn-primary btn-block" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          Groups
        </a>
        <button class="btn btn-outline btn-block" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Log out
        </button>
      </div>
    </main>
  </body>
</html>
